<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Architecture - EVAKWAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --border-light: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Controls */
    .action-bar {
      width: 100%;
      max-width: 780px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 10px 18px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      box-shadow: 0 2px 8px -2px rgba(15, 23, 42, 0.05);
    }

    .action-bar h2 {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.01em;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: #334155;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #f8fafc;
      color: #0f172a;
    }

    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
    }

    .btn-primary:hover {
      background: #0369a1;
      color: #ffffff;
    }

    /* Diagram Canvas */
    .diagram-container {
      width: 100%;
      max-width: 780px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-light);
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .viewport {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #ffffff;
    }

    svg#archSvg {
      width: 100%;
      height: auto;
      max-width: 720px;
      display: block;
      user-select: none;
    }

    svg text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-rendering: geometricPrecision;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }

      .action-bar {
        display: none !important;
      }

      .diagram-container {
        box-shadow: none;
        border: none;
        padding: 0;
        max-width: 100%;
      }

      svg#archSvg {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Top Action Bar -->
  <div class="action-bar">
    <h2>EVAKWAR System Architecture</h2>
    <div class="btn-group">
      <button type="button" class="btn" onclick="zoomIn()">Zoom In</button>
      <button type="button" class="btn" onclick="zoomOut()">Zoom Out</button>
      <button type="button" class="btn" onclick="resetZoom()">Reset</button>
      <button type="button" class="btn btn-primary" onclick="exportAsImage(event)">Export as PNG</button>
      <button type="button" class="btn btn-primary" onclick="exportAsPdf(event)">Export as PDF</button>
      <button type="button" class="btn" onclick="exportAsSvg(event)">Export as SVG</button>
      <button type="button" class="btn" onclick="window.print()">Print</button>
    </div>
  </div>

  <!-- Main Vector Diagram Container (Portrait Mode) -->
  <div class="diagram-container">

          <!-- Card Drop Shadow -->

        <!-- 1. USER LAYER (STAKEHOLDERS)                                              -->
        <!-- ========================================================================= -->

          <!-- Outer Dashed Container -->

          <!-- Badge Header -->

          <text x="360" y="29" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d"
            letter-spacing="0.5">USER LAYER</text>

          <!-- 1. BDRRMC Admin -->
          <g transform="translate(74, 42)">

          <!-- 2. Barangay Staff -->
          <g transform="translate(220, 42)">

            <text x="67" y="40" text-anchor="middle" font-size="9" font-weight="600" fill="#1e293b">Barangay
              Staff (Site/Rescuer)</text>
          </g>


          <!-- 4. Households -->
          <g transform="translate(512, 42)">
            <circle cx="59" cy="17" r="3.2" fill="#0284c7" />
            <circle cx="67" cy="14" r="3.8" fill="#0369a1" />
            <circle cx="75" cy="17" r="3.2" fill="#0284c7" />

            <text x="67" y="40" text-anchor="middle" font-size="9" font-weight="600" fill="#1e293b">Households</text>
          </g>
        </g>

        <!-- Connector 1: User Layer -> Client Layer -->
        <g id="conn-user-to-client">

          <text x="372" y="133" font-size="8.5" font-weight="500" fill="#334155">Browser Access (HTTPS / PWA
            Install)</text>
        </g>

        <!-- ========================================================================= -->
        <!-- 2. CLIENT LAYER (PWA) - ESSENTIAL DEFENSE TECHNOLOGIES ONLY               -->
        <!-- ========================================================================= -->
        <g id="layer-client">

          </g>

            <path d="M 19 17 L 21.5 13.5 L 24 17 M 26.5 12.5 L 26.5 19.5" stroke="#ffffff" stroke-width="1.2"

            <text x="44" y="21" font-size="9" font-weight="600" fill="#1e293b">Service Worker (PWA)</text>

            <path d="M 16 11 L 16 17 C 16 19 30 19 30 17 L 30 11" fill="none" stroke="#0284c7" stroke-width="1.1" />

            <text x="44" y="21" font-size="9" font-weight="600" fill="#1e293b">Dexie.js (IndexedDB)</text>
          </g>
        </g>

        <!-- Connector 2: Client Layer -> Application Server Layer -->
        <g id="conn-client-to-server">
          <line x1="360" y1="282" x2="360" y2="322" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow-down)" />
          <text x="372" y="306" font-size="8.5" font-weight="500" fill="#334155">REST API / WebSocket (Socket.IO)</text>
        </g>

        <!-- 3. APPLICATION SERVER LAYER (CORE BACKEND STACK)                          -->
        <!-- ========================================================================= -->

          <!-- Outer Dashed Container -->
          <rect x="60" y="326" width="600" height="74" rx="10" fill="#ffffff" stroke="#f472b6" stroke-width="1.4" />

  <script>
    if (typeof window.jspdf === 'undefined') {

  <!-- Interactive Pan/Zoom & Verified Export Scripts -->
  <script>
    let currentZoom = 1;
    const svgEl = document.getElementById('archSvg');

    function applyZoom() {
      svgEl.style.transform = "scale(" + currentZoom + ")";
      svgEl.style.transformOrigin = 'top center';
      svgEl.style.transition = 'transform 0.2s ease-out';
    }

    function zoomIn() {
      if (currentZoom < 1.8) {
        currentZoom += 0.15;
        applyZoom();
      }
    }

    function zoomOut() {
      if (currentZoom > 0.6) {
        currentZoom -= 0.15;
        applyZoom();
      }
    }

    function resetZoom() {
      currentZoom = 1;
      applyZoom();
    }

    // Helper: Render SVG onto an offscreen canvas at high resolution (2.5x scale: 1800x2250px)
    function renderSvgToCanvas(scale) {
      scale = scale || 2.5;
      return new Promise((resolve, reject) => {
        const clonedSvg = svgEl.cloneNode(true);
        clonedSvg.style.transform = '';
        clonedSvg.setAttribute('width', (720 * scale) + 'px');
        clonedSvg.setAttribute('height', (900 * scale) + 'px');

        // CRITICAL FIX: Strip all HTML comments containing double-hyphens ('--')
        // XML standard prohibits '--' within comments, which causes XML parsers in browser Image decoders to fail.
        let xml = new XMLSerializer().serializeToString(clonedSvg);
        const commentRegex = new RegExp('<' + '!--[\\s\\S]*?--' + '>', 'g');
        xml = xml.replace(commentRegex, '');

        const svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
        const URLObj = window.URL || window.webkitURL || window;
        const blobUrl = URLObj.createObjectURL(svgBlob);

        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 720 * scale;
          canvas.height = 900 * scale;
          const ctx = canvas.getContext('2d');

          // Pure white background
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          URLObj.revokeObjectURL(blobUrl);
          resolve(canvas);
        };
        img.onerror = (err) => {
          URLObj.revokeObjectURL(blobUrl);
          reject(new Error('SVG Image rasterization failed: ' + (err.message || 'decode error')));
        };
        img.src = blobUrl;
      });
    }

    // 1. Export as High-Resolution PNG Image
    async function exportAsImage(ev) {
      const btn = ev ? ev.currentTarget : null;
      const originalText = btn ? btn.innerText : '';
      if (btn) btn.innerText = 'Exporting...';

      try {
        const canvas = await renderSvgToCanvas(2.5);
        const a = document.createElement('a');
        a.download = 'EVAKWAR_System_Architecture.png';
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        console.error('PNG export failed:', err);
        alert('Failed to export PNG: ' + err.message);
      } finally {
        if (btn) btn.innerText = originalText;
      }
    }

    // 2. Export as High-Resolution PDF
    async function exportAsPdf(ev) {
      const btn = ev ? ev.currentTarget : null;
      const originalText = btn ? btn.innerText : '';
      if (btn) btn.innerText = 'Generating PDF...';

      try {
        const canvas = await renderSvgToCanvas(2.5);
        const imgData = canvas.toDataURL('image/jpeg', 0.95);

        const jsPdfClass = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
        if (jsPdfClass) {
          const pdf = new jsPdfClass({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
          });

          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          const margin = 8;
          const usableWidth = pageWidth - (margin * 2);
          const usableHeight = pageHeight - (margin * 2);

          const imgRatio = canvas.width / canvas.height;
          let printWidth = usableWidth;
          let printHeight = printWidth / imgRatio;

          if (printHeight > usableHeight) {
            printHeight = usableHeight;
            printWidth = printHeight * imgRatio;
          }

          const xOffset = margin + (usableWidth - printWidth) / 2;
          const yOffset = margin + (usableHeight - printHeight) / 2;

          pdf.addImage(imgData, 'JPEG', xOffset, yOffset, printWidth, printHeight, undefined, 'FAST');
          pdf.save('EVAKWAR_System_Architecture.pdf');
        } else {
          window.print();
        }
      } catch (err) {
        console.error('PDF export failed:', err);
        alert('Failed to export PDF: ' + err.message);
      } finally {
        if (btn) btn.innerText = originalText;
      }
    }

    // 3. Export as Pure Vector SVG
    function exportAsSvg(ev) {
      const clonedSvg = svgEl.cloneNode(true);
      clonedSvg.style.transform = '';
      clonedSvg.setAttribute('width', '720');
      clonedSvg.setAttribute('height', '900');
      let xml = new XMLSerializer().serializeToString(clonedSvg);
      const commentRegex = new RegExp('<' + '!--[\\s\\S]*?--' + '>', 'g');
      xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + xml.replace(commentRegex, '');
      const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
      const a = document.createElement('a');
      a.download = 'EVAKWAR_System_Architecture.svg';
      const URLObj = window.URL || window.webkitURL || window;
      a.href = URLObj.createObjectURL(blob);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
